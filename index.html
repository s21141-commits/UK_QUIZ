<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영국 탐험 퀴즈</title>
<style>
  :root{
    --navy:#0A1F44;
    --red:#C8102E;
    --cream:#F7F1E3;
    --gold:#D4A017;
    --sky:#4A7FB5;
    --ink:#1B1B1B;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Georgia', 'Nanum Myeongjo', serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(200,16,46,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(10,31,68,0.08), transparent 45%),
      var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .app{
    width:100%;
    max-width:560px;
  }
  .masthead{
    text-align:center;
    margin-bottom:26px;
  }
  .masthead .flagbar{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom:14px;
  }
  .flagbar span{
    width:34px;height:6px;border-radius:3px;
  }
  .flagbar span:nth-child(1){background:var(--red);}
  .flagbar span:nth-child(2){background:var(--navy);}
  .flagbar span:nth-child(3){background:var(--gold);}
  .masthead h1{
    font-size:2rem;
    margin:0;
    letter-spacing:-0.5px;
    color:var(--navy);
  }
  .masthead p{
    margin:8px 0 0;
    color:#5a5a5a;
    font-size:0.95rem;
    font-family:'Trebuchet MS', sans-serif;
  }
  .music-btn{
    margin-top:14px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.82rem;
    font-weight:bold;
    background:#fff;
    border:2px solid var(--navy);
    color:var(--navy);
    padding:7px 16px;
    border-radius:20px;
    cursor:pointer;
  }
  .music-btn.on{
    background:var(--navy);
    color:var(--cream);
  }

  /* SETUP SCREEN */
  .panel{
    background:var(--card);
    border:1px solid #e6ddc7;
    border-radius:14px;
    padding:26px 22px;
    box-shadow: 0 10px 30px rgba(10,31,68,0.06);
  }
  .field-label{
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    color:var(--navy);
    font-size:0.95rem;
    margin:0 0 10px;
  }
  .option-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
    margin-bottom:22px;
  }
  .option-grid.two{grid-template-columns:1fr 1fr;}
  .opt-btn{
    font-family:'Trebuchet MS', sans-serif;
    border:2px solid #dcd3ba;
    background:#fffdf8;
    border-radius:10px;
    padding:14px 8px;
    font-size:0.92rem;
    cursor:pointer;
    text-align:center;
    color:var(--ink);
    transition:border-color .15s, background .15s, transform .1s;
    line-height:1.3;
  }
  .opt-btn .emoji{display:block;font-size:1.5rem;margin-bottom:6px;}
  .opt-btn:hover{border-color:var(--sky); transform:translateY(-1px);}
  .opt-btn.selected{
    border-color:var(--red);
    background:#fff5f2;
    color:var(--red);
    font-weight:bold;
  }
  .start-btn{
    width:100%;
    padding:15px;
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    font-size:1.05rem;
    background:var(--navy);
    color:var(--cream);
    border:none;
    border-radius:10px;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  .start-btn:disabled{
    background:#c9c3b3;
    cursor:not-allowed;
  }
  .start-btn:not(:disabled):hover{background:#122a5c;}

  /* QUIZ SCREEN */
  .quiz-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    font-family:'Trebuchet MS', sans-serif;
  }
  .progress-tag{
    font-size:0.85rem;
    color:var(--navy);
    font-weight:bold;
    background:#eef2f8;
    padding:5px 12px;
    border-radius:20px;
  }
  .progress-tag.hard{background:#fbe9e9;color:var(--red);}
  .progress-bar-track{
    height:6px;
    background:#e9e2cd;
    border-radius:4px;
    overflow:hidden;
    margin-bottom:20px;
  }
  .progress-bar-fill{
    height:100%;
    background:var(--gold);
    transition:width .3s ease;
  }
  .q-card{
    background:var(--card);
    border:1px solid #e6ddc7;
    border-radius:14px;
    padding:24px 22px;
    box-shadow:0 10px 30px rgba(10,31,68,0.06);
  }
  .q-text{
    font-size:1.18rem;
    line-height:1.5;
    color:var(--ink);
    margin:0 0 20px;
  }
  .choice{
    display:block;
    width:100%;
    text-align:left;
    font-family:'Trebuchet MS', sans-serif;
    background:#fffdf8;
    border:2px solid #dcd3ba;
    border-radius:10px;
    padding:13px 16px;
    margin-bottom:10px;
    font-size:0.98rem;
    cursor:pointer;
    color:var(--ink);
  }
  .choice:hover{border-color:var(--sky);}
  .choice.correct{
    border-color:#2e7d4f;
    background:#eaf7ee;
    color:#1e5c37;
    font-weight:bold;
  }
  .choice.wrong{
    border-color:var(--red);
    background:#fdeceb;
    color:var(--red);
    font-weight:bold;
  }
  .choice.disabled{cursor:default;}
  .explain{
    margin-top:16px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.9rem;
    color:#4a4a4a;
    background:#f6f3e9;
    border-left:4px solid var(--gold);
    padding:10px 14px;
    border-radius:6px;
    display:none;
  }
  .next-btn{
    margin-top:18px;
    width:100%;
    padding:13px;
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:10px;
    cursor:pointer;
    display:none;
  }

  /* RESULT SCREEN */
  .result-card{
    background:var(--card);
    border:1px solid #e6ddc7;
    border-radius:14px;
    padding:34px 24px;
    text-align:center;
    box-shadow:0 10px 30px rgba(10,31,68,0.06);
  }
  .result-emoji{font-size:3rem;margin-bottom:6px;}
  .result-badge{
    display:inline-block;
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    font-size:0.9rem;
    padding:6px 16px;
    border-radius:20px;
    margin-bottom:10px;
    letter-spacing:0.3px;
  }
  .result-badge.pass{background:#eaf7ee;color:#1e5c37;}
  .result-badge.fail{background:#fdeceb;color:var(--red);}
  .result-score{
    font-size:2.4rem;
    color:var(--navy);
    font-weight:bold;
    margin:4px 0 2px;
  }
  .result-percent{
    font-family:'Trebuchet MS', sans-serif;
    font-size:1.1rem;
    color:var(--navy);
    margin-bottom:4px;
  }
  .result-time{
    font-family:'Trebuchet MS', sans-serif;
    font-size:0.9rem;
    color:#777;
    margin-bottom:16px;
  }
  .result-msg{
    font-family:'Trebuchet MS', sans-serif;
    color:#555;
    margin-bottom:22px;
  }
  .result-btns{display:flex;gap:10px;}
  .result-btns button{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:2px solid var(--navy);
    background:#fff;
    color:var(--navy);
    font-family:'Trebuchet MS', sans-serif;
    font-weight:bold;
    cursor:pointer;
  }
  .result-btns button.primary{
    background:var(--navy);
    color:var(--cream);
  }
  .hidden{display:none;}
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <div class="flagbar"><span></span><span></span><span></span></div>
    <h1>영국 탐험 퀴즈</h1>
    <p>분야와 난이도를 골라 영국 지식을 확인해 보세요</p>
    <button id="musicBtn" class="music-btn">🔇 배경음악 켜기</button>
  </div>

  <!-- SETUP -->
  <div id="setup" class="panel">
    <p class="field-label">1. 분야를 선택하세요</p>
    <div class="option-grid" id="catGrid"></div>

    <p class="field-label">2. 난이도를 선택하세요</p>
    <div class="option-grid two" id="diffGrid"></div>

    <button class="start-btn" id="startBtn" disabled>퀴즈 시작하기</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="quiz-head">
      <span class="progress-tag" id="progressTag"></span>
      <span class="progress-tag" id="scoreTag"></span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="q-card">
      <p class="q-text" id="qText"></p>
      <div id="choices"></div>
      <div class="explain" id="explain"></div>
      <button class="next-btn" id="nextBtn">다음 문제</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <div class="result-badge" id="resultBadge"></div>
      <div class="result-score" id="resultScore"></div>
      <div class="result-percent" id="resultPercent"></div>
      <div class="result-time" id="resultTime"></div>
      <div class="result-msg" id="resultMsg"></div>
      <div class="result-btns">
        <button id="retryBtn">같은 문제 다시</button>
        <button class="primary" id="homeBtn">다른 분야 선택</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ---------------- 문제 데이터 (테스트용 샘플) ---------------- */
const QUESTIONS = {
  geo: {
    label: "지리 & 기후",
    emoji: "🗺️",
    low: [
      {topic:"location", q:"영국은 섬나라일까요, 대륙 나라일까요?", choices:["섬나라","대륙 안에 있는 나라","사막 나라","호수 나라"], answer:0, explain:"영국은 바다로 둘러싸인 섬나라예요."},
      {topic:"location", q:"영국은 어느 대륙 근처에 있을까요?", choices:["유럽","아시아","아프리카","아메리카"], answer:0, explain:"영국은 유럽 대륙 옆에 있는 섬나라예요."},
      {topic:"location", q:"영국은 어느 쪽 바다 위에 있을까요?", choices:["유럽 대륙의 서쪽 바다","유럽 대륙의 동쪽 바다","아시아 대륙의 바다","아프리카 대륙의 바다"], answer:0, explain:"영국은 유럽 대륙 서쪽 바다 위에 있어요."},
      {topic:"location", q:"영국을 둘러싸고 있는 것은 무엇일까요?", choices:["바다","사막","산","호수"], answer:0, explain:"영국은 바다로 둘러싸인 나라예요."},
      {topic:"location", q:"영국은 무엇 위에 있는 나라일까요?", choices:["섬","반도","사막","고원"], answer:0, explain:"영국은 바다 위에 떠 있는 섬이에요."},
      {topic:"location", q:"영국과 유럽 대륙 사이에는 무엇이 있을까요?", choices:["바다","산","강","사막"], answer:0, explain:"영국과 유럽 대륙 사이에는 바다가 있어요."},
      {topic:"location", q:"영국은 다른 나라와 어떻게 떨어져 있을까요?", choices:["바다로 떨어져 있다","산으로 떨어져 있다","땅으로 붙어 있다","떨어져 있지 않다"], answer:0, explain:"영국은 바다로 둘러싸인 섬나라라서 다른 나라와 바다로 떨어져 있어요."},
      {topic:"region", q:"영국은 몇 개의 지역으로 이루어져 있을까요?", choices:["4개","1개","2개","7개"], answer:0, explain:"영국은 잉글랜드, 스코틀랜드, 웨일스, 북아일랜드 4개 지역으로 이루어져 있어요."},
      {topic:"region", q:"다음 중 영국을 이루는 지역이 아닌 것은?", choices:["프랑스","잉글랜드","스코틀랜드","웨일스"], answer:0, explain:"프랑스는 영국을 이루는 지역이 아니에요."},
      {topic:"region", q:"잉글랜드는 영국의 무엇일까요?", choices:["영국을 이루는 지역 중 하나","영국의 이웃 나라","영국의 옛 이름","영국의 도시 이름"], answer:0, explain:"잉글랜드는 영국을 이루는 4개 지역 중 하나예요."},
      {topic:"region", q:"스코틀랜드는 영국의 무엇일까요?", choices:["영국을 이루는 지역 중 하나","영국의 이웃 나라","영국의 옛 이름","영국의 도시 이름"], answer:0, explain:"스코틀랜드는 영국을 이루는 4개 지역 중 하나예요."},
      {topic:"region", q:"웨일스는 영국의 무엇일까요?", choices:["영국을 이루는 지역 중 하나","영국의 이웃 나라","영국의 옛 이름","영국의 도시 이름"], answer:0, explain:"웨일스는 영국을 이루는 4개 지역 중 하나예요."},
      {topic:"region", q:"북아일랜드는 영국의 무엇일까요?", choices:["영국을 이루는 지역 중 하나","영국의 이웃 나라","영국의 옛 이름","영국의 도시 이름"], answer:0, explain:"북아일랜드는 영국을 이루는 4개 지역 중 하나예요."},
      {topic:"climate", q:"영국의 기후는 무엇일까요?", choices:["온대 해양성 기후","열대 기후","사막 기후","고산 기후"], answer:0, explain:"영국은 온대 해양성 기후예요."},
      {topic:"climate", q:"영국에는 무엇이 자주 낄까요?", choices:["안개","황사","눈보라","모래바람"], answer:0, explain:"영국은 안개가 자주 끼는 나라예요."},
      {topic:"climate", q:"영국에는 무엇이 자주 내릴까요?", choices:["비","눈","우박","황사"], answer:0, explain:"영국은 비가 자주 내리는 나라예요."},
      {topic:"climate", q:"영국의 겨울은 많이 추울까요?", choices:["생각보다 춥지 않다","매우 춥다","한여름처럼 덥다","항상 눈만 온다"], answer:0, explain:"따뜻한 바닷물의 영향으로 영국의 겨울은 생각보다 춥지 않아요."},
      {topic:"climate", q:"영국의 여름은 많이 더울까요?", choices:["많이 덥지 않다","매우 뜨겁다","항상 눈이 온다","일년 중 가장 춥다"], answer:0, explain:"따뜻한 바람의 영향으로 영국의 여름은 많이 덥지 않아요."},
      {topic:"climate", q:"영국의 날씨는 어떻게 변할까요?", choices:["자주 바뀐다","항상 똑같다","점점 더워지기만 한다","점점 추워지기만 한다"], answer:0, explain:"영국은 일년 내내 날씨가 자주 바뀌는 것으로 유명해요."},
      {topic:"climate", q:"영국 날씨의 특징 두 가지는?", choices:["비와 안개","맑음과 건조함","눈과 폭풍","무더위와 습기"], answer:0, explain:"영국은 비와 안개가 자주 나타나는 나라예요."},
      {topic:"climate", q:"영국에 부는 따뜻한 바람은 어느 쪽에서 불어올까요?", choices:["서쪽","동쪽","남쪽","북쪽"], answer:0, explain:"영국에는 서쪽에서 따뜻한 바람이 불어와요."},
      {topic:"climate", q:"영국의 기후 이름으로 알맞은 것은?", choices:["온대 해양성 기후","열대 우림 기후","냉대 기후","사막 기후"], answer:0, explain:"영국의 기후는 온대 해양성 기후예요."},
      {topic:"river", q:"영국에서 가장 긴 강은 무엇일까요?", choices:["세번강","템스강","머지강","한강"], answer:0, explain:"세번강은 영국에서 가장 긴 강이에요."},
      {topic:"river", q:"런던을 흐르는 강은 무엇일까요?", choices:["템스강","세번강","머지강","나일강"], answer:0, explain:"템스강은 영국의 수도 런던을 흐르는 강이에요."},
      {topic:"river", q:"리버풀을 지나는 강은 무엇일까요?", choices:["머지강","템스강","세번강","한강"], answer:0, explain:"머지강은 영국의 항구 도시 리버풀을 지나는 강이에요."},
      {topic:"river", q:"영국의 강 세 개를 모두 고르면?", choices:["템스강, 세번강, 머지강","한강, 낙동강, 금강","나일강, 아마존강","라인강, 센강"], answer:0, explain:"영국의 유명한 강으로는 템스강, 세번강, 머지강이 있어요."},
      {topic:"river", q:"템스강은 어느 도시를 흐를까요?", choices:["런던","리버풀","맨체스터","카디프"], answer:0, explain:"템스강은 영국의 수도 런던을 흐르는 강이에요."},
      {topic:"river", q:"머지강은 어느 도시를 지날까요?", choices:["리버풀","런던","맨체스터","카디프"], answer:0, explain:"머지강은 영국의 항구 도시 리버풀을 지나는 강이에요."},
      {topic:"river", q:"영국에서 가장 긴 강의 이름은?", choices:["세번강","템스강","머지강","한강"], answer:0, explain:"세번강은 영국에서 가장 긴 강이에요."},
      {topic:"river", q:"길이는 짧지만 런던을 흐르는 강은?", choices:["템스강","세번강","머지강","한강"], answer:0, explain:"템스강은 길이는 길지 않지만 런던을 흐르는 강이에요."}
    ],

let state = { cat:null, diff:null, idx:0, score:0, order:[], startTime:0 };

// 문제 풀이 하나에서 실제로 뽑아 보여줄 문제 개수 (전체 문제가 이보다 많으면 랜덤으로 이만큼만 뽑음)
const QUIZ_PICK_COUNT = 10;

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 같은 소주제(topic)의 문제는 서로 뭉쳐서 나오지만, 소주제 묶음의 순서와
// 각 문제의 선택지 순서(정답 위치)는 매번 랜덤으로 섞이도록 구성
function buildQuizOrder(rawList){
  // 전체 문제 수가 QUIZ_PICK_COUNT보다 많으면, 그 중 QUIZ_PICK_COUNT개만 랜덤으로 뽑기
  const pool = rawList.length > QUIZ_PICK_COUNT
    ? shuffleArray(rawList).slice(0, QUIZ_PICK_COUNT)
    : rawList;

  const groups = [];
  const groupIndexOf = {};
  pool.forEach((item, idx)=>{
    const key = item.topic || ('__single_' + idx);
    if(!(key in groupIndexOf)){
      groupIndexOf[key] = groups.length;
      groups.push([]);
    }
    groups[groupIndexOf[key]].push(item);
  });
  const shuffledGroups = shuffleArray(groups);
  const flat = shuffledGroups.flat();
  return flat.map(item=>{
    const correctText = item.choices[item.answer];
    const shuffledChoices = shuffleArray(item.choices);
    const newAnswer = shuffledChoices.indexOf(correctText);
    return { q:item.q, choices:shuffledChoices, answer:newAnswer, explain:item.explain };
  });
}

/* ---------------- 배경음악 (영국풍 행진곡풍 멜로디, 자체 생성 · 파일 없음) ---------------- */
let audioCtx = null;
let masterGain = null;
let musicPlaying = false;
let musicTimer = null;
let activeNodes = [];

const NOTE_FREQ = {
  C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
  C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77
};

// 자체 제작한 영국풍 행진곡 느낌의 짧은 멜로디 루프 (실제 곡 아님, 저작권 없음)
const MELODY = [
  {n:'G4',d:0.30},{n:'G4',d:0.30},{n:'C5',d:0.45},{n:'E5',d:0.15},
  {n:'D5',d:0.30},{n:'C5',d:0.30},{n:'E5',d:0.45},{n:'D5',d:0.15},
  {n:'G4',d:0.30},{n:'G4',d:0.30},{n:'A4',d:0.30},{n:'B4',d:0.30},
  {n:'C5',d:0.60},{n:'G4',d:0.60},
  {n:'A4',d:0.30},{n:'A4',d:0.30},{n:'B4',d:0.30},{n:'C5',d:0.30},
  {n:'D5',d:0.60},{n:'A4',d:0.60}
];

function playNote(freq, duration, startTime){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(0.14, startTime + 0.02);
  gain.gain.linearRampToValueAtTime(0, startTime + duration);
  osc.connect(gain);
  gain.connect(masterGain);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
  activeNodes.push(osc);
  osc.onended = ()=>{
    activeNodes = activeNodes.filter(n=>n!==osc);
  };
}

function scheduleLoop(){
  if(!musicPlaying) return;
  let t = audioCtx.currentTime + 0.05;
  let totalDur = 0;
  MELODY.forEach(note=>{
    playNote(NOTE_FREQ[note.n], note.d*0.95, t);
    t += note.d;
    totalDur += note.d;
  });
  musicTimer = setTimeout(scheduleLoop, totalDur*1000);
}

function ensureAudioCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 1;
    masterGain.connect(audioCtx.destination);
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}

function playFxTone(freq, start, dur, type, vol){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, start);
  gain.gain.linearRampToValueAtTime(vol, start + 0.02);
  gain.gain.linearRampToValueAtTime(0, start + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination); // 배경음악과 별도로 항상 들리도록 destination에 직접 연결
  osc.start(start);
  osc.stop(start + dur + 0.02);
}

function playSuccessSound(){
  ensureAudioCtx();
  const t = audioCtx.currentTime;
  // 상승하는 승리 아르페지오 (C5-E5-G5-C6)
  [523.25, 659.25, 783.99, 1046.50].forEach((freq, i)=>{
    playFxTone(freq, t + i*0.13, 0.28, 'triangle', 0.2);
  });
}

function playFailSound(){
  ensureAudioCtx();
  const t = audioCtx.currentTime;
  // 하강하는 낮은 부저음
  playFxTone(220, t, 0.18, 'sawtooth', 0.16);
  playFxTone(185, t + 0.15, 0.18, 'sawtooth', 0.16);
  playFxTone(140, t + 0.30, 0.35, 'sawtooth', 0.16);
}

const musicBtn = document.getElementById('musicBtn');
musicBtn.onclick = ()=>{
  ensureAudioCtx();
  if(!musicPlaying){
    musicPlaying = true;
    audioCtx.resume();
    scheduleLoop();
    musicBtn.textContent = '🔊 배경음악 끄기';
    musicBtn.classList.add('on');
  } else {
    musicPlaying = false;
    clearTimeout(musicTimer);
    const now = audioCtx.currentTime;
    masterGain.gain.cancelScheduledValues(now);
    masterGain.gain.setValueAtTime(masterGain.gain.value, now);
    masterGain.gain.linearRampToValueAtTime(0, now + 0.03);
    activeNodes.forEach(osc=>{
      try{ osc.stop(now + 0.04); }catch(e){}
    });
    activeNodes = [];
    setTimeout(()=>{
      masterGain.gain.setValueAtTime(1, audioCtx.currentTime);
    }, 60);
    musicBtn.textContent = '🔇 배경음악 켜기';
    musicBtn.classList.remove('on');
  }
};

function formatTime(ms){
  const totalSec = Math.floor(ms/1000);
  const min = Math.floor(totalSec/60);
  const sec = totalSec%60;
  return `${min}분 ${sec.toString().padStart(2,'0')}초`;
}

function checkReady(){
  startBtn.disabled = !(state.cat && state.diff);
}

startBtn.onclick = ()=>{

  state.idx = 0;
  state.score = 0;
  state.startTime = Date.now();
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('result').classList.add('hidden');

/* ---------------- QUIZ 화면 ---------------- */
const qText = document.getElementById('qText');
const choicesDiv = document.getElementById('choices');
const explainDiv = document.getElementById('explain');
const nextBtn = document.getElementById('nextBtn');
const progressTag = document.getElementById('progressTag');
const scoreTag = document.getElementById('scoreTag');
const progressFill = document.getElementById('progressFill');

function renderQuestion(){
  const total = state.order.length;
  const q = state.order[state.idx];
  const diffLabel = state.diff === 'high' ? '상' : '하';
  progressTag.textContent = `문제 ${state.idx+1} / ${total} · 난이도 ${diffLabel}`;
  progressTag.className = 'progress-tag' + (state.diff==='high' ? ' hard':'');
  scoreTag.textContent = `맞은 개수: ${state.score}`;
  progressFill.style.width = `${(state.idx/total)*100}%`;

  qText.textContent = `Q${state.idx+1}. ${q.q}`;
  choicesDiv.innerHTML = '';
  explainDiv.style.display = 'none';
  nextBtn.style.display = 'none';

  q.choices.forEach((choiceText, i)=>{
    const btn = document.createElement('button');
    btn.className = 'choice';
    btn.textContent = choiceText;
    btn.onclick = ()=> selectAnswer(i, btn);
    choicesDiv.appendChild(btn);
  });
}

function selectAnswer(i, btnEl){
  const q = state.order[state.idx];
  const allBtns = choicesDiv.querySelectorAll('.choice');
  allBtns.forEach(b=>b.classList.add('disabled'));
  allBtns.forEach(b=>b.onclick=null);

  if(i === q.answer){
    btnEl.classList.add('correct');
    state.score++;
  } else {
    btnEl.classList.add('wrong');
    allBtns[q.answer].classList.add('correct');
  }
  explainDiv.textContent = `💬 ${q.explain}`;
  explainDiv.style.display = 'block';
  nextBtn.style.display = 'block';
  scoreTag.textContent = `맞은 개수: ${state.score}`;
}

nextBtn.onclick = ()=>{
  state.idx++;
  if(state.idx >= state.order.length){
    showResult();
  } else {
    renderQuestion();
  }
};

/* ---------------- RESULT 화면 ---------------- */
function showResult(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  const total = state.order.length;
  const score = state.score;
  const percent = Math.round((score/total)*100);
  const elapsed = Date.now() - state.startTime;
  const isPass = percent >= 90;

  document.getElementById('resultScore').textContent = `${score} / ${total} 개 정답`;
  document.getElementById('resultPercent').textContent = `정답률 ${percent}%`;
  document.getElementById('resultTime').textContent = `걸린 시간: ${formatTime(elapsed)}`;

  const badge = document.getElementById('resultBadge');
  badge.textContent = isPass ? '✅ 성공 (90% 이상)' : '❌ 실패 (90% 미만)';
  badge.className = 'result-badge ' + (isPass ? 'pass' : 'fail');

  if(isPass){ playSuccessSound(); } else { playFailSound(); }

  let emoji, msg;
  if(score === total){ emoji='🏆'; msg='완벽해요! 영국 박사님이 따로 없네요!'; }
  else if(isPass){ emoji='🎉'; msg='아주 잘했어요! 90%를 넘겨서 성공이에요.'; }
  else if(score >= total*0.7){ emoji='👍'; msg='조금만 더 하면 성공이에요! 다시 도전해볼까요?'; }
  else if(score >= total*0.4){ emoji='💪'; msg='잘하고 있어요! 다시 한 번 도전해볼까요?'; }
  else { emoji='📚'; msg='조금 더 공부하고 다시 도전해봐요!'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultMsg').textContent = msg;
}

document.getElementById('retryBtn').onclick = ()=>{
  state.order = buildQuizOrder(QUESTIONS[state.cat][state.diff]);
  state.idx = 0;
  state.score = 0;
  state.startTime = Date.now();
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQuestion();
};

document.getElementById('homeBtn').onclick = ()=>{
  state.cat = null; state.diff = null;
  document.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('selected'));
  startBtn.disabled = true;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
};
</script>
</body>
</html>
